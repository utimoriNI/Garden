name: Create daily note

on:
  schedule:
    # 23:50 in Japan (UTC+9), so notes added during that day are included.
    - cron: "50 14 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to create (YYYY-MM-DD); leave blank for today in Japan"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: create-daily-note
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create the daily note
        env:
          DAILY_NOTE_DATE: ${{ github.event.inputs.date || '' }}
        run: |
          if [ -n "$DAILY_NOTE_DATE" ]; then
            python3 scripts/create_daily_note.py --date "$DAILY_NOTE_DATE"
          else
            python3 scripts/create_daily_note.py
          fi

      - name: Commit and push the note
        run: |
          git add -- 100_Periodic/Daily/
          if git diff --cached --quiet; then
            echo "No new daily note to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: create daily note"
          git push

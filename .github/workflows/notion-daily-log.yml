name: Update Notion daily log

on:
  schedule:
    # 00:15 JST: collect the complete previous calendar day.
    - cron: "15 15 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Log date (YYYY-MM-DD); blank means yesterday in Japan"
        required: false
        type: string
      dry_run:
        description: "Preview the log without accessing or updating Notion"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: notion-daily-log
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out default branch and complete history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify daily log behavior
        run: python -m unittest discover -s scripts/tests -p test_sync_notion_daily_log.py

      - name: Update Notion log
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          DAILY_LOG_DATE: ${{ inputs.date }}
          DAILY_LOG_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$DAILY_LOG_DATE" ]; then
            args+=(--date "$DAILY_LOG_DATE")
          fi
          if [ "$DAILY_LOG_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/sync_notion_daily_log.py "${args[@]}"
